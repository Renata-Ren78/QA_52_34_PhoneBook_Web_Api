name: Smoke tests

on:
  push:
    branches: ["master"]
  #schedule:

jobs:
  test:
    #runs-on: ubuntu-latest
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install chrome
        uses: browser-actions/setup-chrome@latest
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle Wrapper
        run: .\gradlew clean scope
      - name: Show test reports
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path build/reports/tests/scope -Recurse
          Get-Content build/test-results/scope/*.xml
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/
            build/test-results/